# Render Blueprint — Ivi backend
# Cómo desplegar (dos caminos):
#   1) Push de este repo a GitHub y conectar en Render -> New -> Blueprint,
#      o
#   2) Nuevo Web Service manual (Node) apuntando al repo, copiando estos
#      mismos build/start commands y variables.
#
# Las variables marcadas con `sync: false` son SECRETOS: Render las pide
# a mano al crear el servicio (o las cargás después en Settings -> Environment).
# Las de `value` ya traen el valor por defecto del proyecto.

services:
  - type: web
    name: ivi-backend
    runtime: node
    plan: free            # free tier: duerme tras ~15 min sin tráfico
    region: oregon
    # migrate deploy: aplicado localmente; el build de Render (free) falla al
    # conectar a Neon (P1001) — ver scripts/migrate-deploy.cjs para reintentos.
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      # OJO: el límite de Groq son 200,000 tokens/día POR MODELO, y este es el
      # que más rápido contesta (medido: 0.7-0.8s, 150-216 tokens de salida).
      # Si este modelo se queda sin cuota, el server pasa solo al de respaldo
      # sin gastar un token más — por eso conviene tener los dos.
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_MODEL_FALLBACK
        value: openai/gpt-oss-20b
      - key: GROQ_MODEL_EXTRACCION
        value: openai/gpt-oss-20b
      # NO definas GROQ_REASONING_EFFORT: los modelos gpt-oss solo aceptan
      # low/medium/high y con cualquier otro valor Groq rechaza el request con
      # 400. Para respuesta corta no hace falta.
      #
      # La voz de Ivi. Tiene que ser la MISMA que usan los MP3 pregrabados
      # (src/assets) y el embebido en el firmware; si se desincroniza, la frase
      # de emergencia suena con otra persona que el resto del robot.
      - key: EDGE_TTS_VOICE
        value: es-MX-DaliaNeural
      - key: TTS_PITCH
        value: +20Hz
      - key: TTS_RATE
        value: "1.1"
      # Zona horaria de "¿qué día es hoy?". El server corre en UTC, así que sin
      # esto Ivi da el día y la hora equivocados.
      - key: FECHA_TZ
        value: America/Mazatlan
      # Tope del turno completo (STT ya corrido + LLM + TTS). El ESP32 aborta el
      # POST a los 65000ms: si el server se pasa, el dispositivo se queda sin
      # audio. 45000 deja margen para la latencia de red.
      - key: TURNO_DEADLINE_MS
        value: "45000"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SERVER_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USER
        value: ivi
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: WIFI_ENC_KEY
        sync: false
      #
      # --- Copiloto: estado de OpenCode -------------------------------------
      # POST /api/copilot/state recibe lo que manda el plugin de OpenCode.
      #
      # COPILOT_TOKEN es un secreto DISTINTO a propósito. Si compartiera valor
      # con ADMIN_SECRET, cualquier acceso al panel expondría también la
      # capacidad de inyectar estado falso a Ivi. Tiene que ser el mismo valor
      # que IVI_TOKEN en ~/.config/opencode/ivi.env de tu máquina.
      - key: COPILOT_TOKEN
        sync: false
      # Qué proyectos pueden reportar estado. Sin esto, el endpoint acepta
      # cualquier nombre de proyecto que le manden.
      - key: COPILOT_PROJECTS
        value: mochi-server
      # Cuánto sigue siendo confiable el estado. Pasado esto, Ivi prefiere decir
      # "no tengo esa info" antes que hablar de algo viejo.
      - key: COPILOT_MAX_AGE_MIN
        value: "30"
      # Tope de peticiones del plugin por minuto. Un plugin descontrolado no
      # puede hundir el free tier.
      - key: COPILOT_RATE_MAX
        value: "60"
      - key: COPILOT_RATE_MS
        value: "60000"
      # PORT lo inyecta Render solo; no definirlo acá.