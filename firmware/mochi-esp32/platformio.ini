; Ivi - firmware ESP32-S3-N16R8
; NOTA: verificar el pinout contra la serigrafia/ficha del vendedor al recibir la placa
; (es un clon de Mercado Libre, el pinout puede variar respecto a la referencia oficial).

; NOTA: ESP8266Audio requiere Arduino-ESP32 con IDF 5.x.
; El platform "espressif32" oficial (IDF 4.x) NO compila esta libreria.
; Por eso se usa pioarduino (build desde el Arduino-ESP32 actual con IDF 5.x).
[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.arduino.memory_type = qio_opi   ; flash QSPI + PSRAM Octal
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0  ; Serial -> USB-Serial/JTAG (canal estable para leer este clon; el CDC app no se enlista)

; PARCHES DE DRIVER (conflicto ESP-IDF: driver nuevo i2s_std del mic
; RX no podia coexistir con el legacy i2s_driver_install/ESP8266Audio de la
; bocina en el mismo binario -> abortaba "i2s(legacy): CONFLICT").
; RECONCILIACION COMPLETA:
;  - Bocina TX migro a i2s_std (audio_play.cpp). Tono/WAV via pcmTxOpen.
;  - Ruta MP3 (NORMAL): AudioOutputI2SStd (subclase AudioOutput que escribe
;    por i2s_channel_write, NUNCA toca el driver legacy) + AudioGeneratorMP3.
;    IMPORTANTE: ESP8266Audio NO puede quedar linkeada entera: sus
;    AudioOutputI2S*.cpp referencian i2s_driver_install y enlazan el driver
;    legacy I2S, que registra un ctor global que aborta al arranque cuando el
;    driver nuevo esta presente. Por eso el stack del decoder (AudioGeneratorMP3,
;    AudioGenerator, AudioOutput, AudioLogger, AudioStatus, AudioFileSource,
;    libmad) esta VENDEADO en src/esp8266audio, y aqui NO se lista la lib.
src_filter = +<*>

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.10
    adafruit/Adafruit SH110X @ ^1.1.13
    adafruit/Adafruit GFX Library @ ^1.11.9
